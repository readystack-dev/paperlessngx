[supervisord]
nodaemon=true
user=paperless
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:webserver]
command=granian --interface asginl --ws --loop uvloop --host 0.0.0.0 --port 8000 paperless.asgi:application
directory=/usr/src/paperless/src
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
command=celery --app paperless worker --loglevel INFO --without-mingle --without-gossip
directory=/usr/src/paperless/src
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=celery --app paperless beat --loglevel INFO
directory=/usr/src/paperless/src
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:consumer]
command=python manage.py document_consumer
directory=/usr/src/paperless/src
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
